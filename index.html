<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Отдых в Астане</title>
<style>
:root{--bg:#f6f8fb;--c:#fff;--t:#14202e;--m:#5b6b7d;--a:#0a8f8f;--b:#dde4ec;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1720;--c:#182331;--t:#e8eef5;--m:#9aabbd;--a:#3cc5c5;--b:#2a394b}}
:root[data-theme="dark"]{--bg:#0f1720;--c:#182331;--t:#e8eef5;--m:#9aabbd;--a:#3cc5c5;--b:#2a394b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--t);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
header{padding:32px 16px 16px;text-align:center}
h1{margin:0 0 6px;font-size:1.8rem}header p{margin:0;color:var(--m)}
.bar{max-width:1000px;margin:0 auto;padding:0 16px}
input{width:100%;box-sizing:border-box;padding:12px 14px;border:1px solid var(--b);border-radius:10px;background:var(--c);color:var(--t);font:inherit;margin:12px 0}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.tabs button{border:1px solid var(--b);background:var(--c);color:var(--t);padding:8px 12px;border-radius:20px;cursor:pointer;font:inherit;font-size:.9rem}
.tabs button.on{background:var(--a);color:#fff;border-color:var(--a)}
main{max-width:1000px;margin:0 auto;padding:8px 16px 40px}
h2{margin:24px 0 10px;font-size:1.3rem}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:14px;position:relative}
.card h3{margin:0 40px 4px 0;font-size:1.05rem}.card p{margin:0 0 6px;color:var(--m);font-size:.93rem}
.card small{color:var(--a)}
.fav{position:absolute;top:10px;right:10px;border:0;background:none;font-size:1.4rem;cursor:pointer;color:var(--m)}
.fav.on{color:#e0245e}
#quiz{max-width:968px;margin:8px auto 12px;padding:16px;background:var(--c);border:1px solid var(--b);border-radius:14px}#quiz h2{margin:4px 0 12px}.qn{margin:0;color:var(--a);font-size:.85rem}
.btn{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px;border:1px solid var(--b);border-radius:10px;background:var(--bg);color:var(--t);font:inherit;cursor:pointer}.btn:hover{border-color:var(--a)}
.meter{height:10px;background:var(--b);border-radius:6px;overflow:hidden}.meter i{display:block;height:100%;background:var(--a)}
#quiz.gate{position:fixed;inset:0;z-index:100;max-width:none;margin:0;border-radius:0;border:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;overflow:auto;padding:calc(24px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px))}
#quiz.gate::before,#quiz.gate::after{content:"";flex:1}#quiz.gate>*{width:100%;max-width:560px;box-sizing:border-box}#quiz.off{display:none}
.ph{display:inline-block;margin:2px 0 0;color:var(--a);font-size:.9rem;text-decoration:none}
footer{text-align:center;color:var(--m);font-size:.85rem;padding:0 16px 30px}

[hidden]{display:none!important}
.m{color:var(--m)}.er{color:#e0245e;min-height:1.3em;margin:6px 0 0}
#auth{position:fixed;inset:0;overflow:auto;display:flex;padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(20px + env(safe-area-inset-bottom,0px))}
.ac{width:100%;max-width:440px;margin:auto}.ac h1{margin:0 0 8px}
.tb{display:flex;gap:8px;margin:18px 0 0}.tb button{flex:1;padding:10px;border:1px solid var(--b);border-radius:10px;background:var(--c);color:var(--t);font:inherit;cursor:pointer}
.tb button.on,.c{background:var(--a);color:#fff;border-color:var(--a)}.c{text-align:center}
#app header{display:flex;justify-content:space-between;align-items:center;max-width:1000px;margin:0 auto;padding:16px;text-align:left}#app header h1{font-size:1.4rem}
#av,.av2{width:44px;height:44px;flex:none;border-radius:50%;border:0;background:var(--a);color:#fff;font:700 1.1rem system-ui,sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center}
#pf{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.pc{background:var(--c);border-radius:14px;max-width:520px;width:100%;max-height:85vh;overflow:auto;padding:20px;box-sizing:border-box}
.pc h3{margin:18px 0 6px}.pc ul{padding-left:18px;margin:0}.pc li{margin:4px 0}
.vb{display:inline-block;margin:6px 8px 0 0;padding:6px 10px;border:1px solid var(--a);border-radius:8px;background:none;color:var(--a);font:inherit;font-size:.88rem;cursor:pointer}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--t);color:var(--bg);padding:10px 16px;border-radius:20px;opacity:0;transition:.3s;pointer-events:none;z-index:300}#toast.on{opacity:1}
</style></head><body>
<div id="auth"><div class="ac"><h1>🌆 Отдых в Астане</h1>
<p class="m">Персональные подборки мест для отдыха по вашему настроению. Пройдите короткий тест из 5 вопросов, получите рекомендации из 100 мест города (парки, ТЦ, бани, бассейны, кафе, аттракционы), отмечайте, где побывали, и возвращайтесь к своей истории.</p>
<div class="tb"><button id="tl" class="on">Войти</button><button id="tr">Регистрация</button></div>
<input id="lg" placeholder="Логин" autocomplete="username"><input id="pw" type="password" placeholder="Пароль (от 6 символов)" autocomplete="current-password">
<button class="btn c" id="sub">Войти</button><p id="err" class="er"></p></div></div>
<script src="db.js"></script>
<script>
const $=i=>document.getElementById(i);let mode="login";
function setMode(m){mode=m;$("tl").className=m=="login"?"on":"";$("tr").className=m=="login"?"":"on";$("sub").textContent=m=="login"?"Войти":"Создать аккаунт";$("pw").autocomplete=m=="login"?"current-password":"new-password";$("err").textContent=""}
$("tl").onclick=()=>setMode("login");$("tr").onclick=()=>setMode("register");
async function submit(){try{await DB.call(mode,{login:$("lg").value.trim(),password:$("pw").value});location.replace("app.html")}catch(e){$("err").textContent=e.message}}
$("sub").onclick=submit;$("pw").onkeydown=e=>{if(e.key=="Enter")submit()};
(async()=>{try{await DB.call("me");location.replace("app.html")}catch{}})();
</script></body></html>
